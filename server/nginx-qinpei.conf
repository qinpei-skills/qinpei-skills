server {
    server_name qinpeiskill.com www.qinpeiskill.com qinpeitrust.com www.qinpeitrust.com 115.159.155.21;
    root /var/www/qinpei/html;
    index index.html;
    sub_filter '</body>' '<div style="text-align:center;padding:24px 0;font-size:12px;color:#999;background:transparent;"><a href="https://beian.miit.gov.cn/" target="_blank" rel="noreferrer" style="color:#999;text-decoration:none;">沪ICP备2026017069号</a></div></body>';
    sub_filter_once on;
    sub_filter_types text/html;
    location / {
        try_files $uri $uri/ =404;
    }

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/qinpeiskill.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/qinpeiskill.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot




}
server {
    if ($host = www.qinpeitrust.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = qinpeitrust.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = www.qinpeiskill.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = qinpeiskill.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80 default_server;
    listen [::]:80 default_server;
    server_name qinpeiskill.com www.qinpeiskill.com qinpeitrust.com www.qinpeitrust.com 115.159.155.21;
    return 404; # managed by Certbot








}
